# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        additional_dependencies: [types-toml]
        args: [--strict, --config-file=pyproject.toml, -p, watchlog]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/pycqa/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, src, -ll]
        exclude: ^tests/
        pass_filenames: false

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest (fast subset)
        entry: python -m pytest -x -q --tb=line tests/test_parser_ssh.py tests/test_state.py tests/test_brute_force.py tests/test_password_spray.py tests/test_login_after_failures.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
