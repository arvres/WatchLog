version: "3.8"

services:
  watchlog:
    build: .
    image: watchlog:local
    container_name: watchlog
    restart: unless-stopped
    user: "root:root"  # Needed to read /var/log/auth.log on host
    volumes:
      - /var/log:/var/log:ro
      - ./watchlog.toml:/etc/watchlog/watchlog.toml:ro
    command:
      - /var/log/auth.log
      - --follow
      - --config
      - /etc/watchlog/watchlog.toml
      - --format
      - json
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Example: Ship logs to Loki/Grafana
